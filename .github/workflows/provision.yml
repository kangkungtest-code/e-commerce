name: Provision server

# Setup awal server dev/demo (Biznet Gio).
# Jalan OTOMATIS tiap kali file ini berubah di branch claude-dev
# (tidak perlu tombol Run workflow, jadi tidak bergantung ke branch main).
# Untuk menjalankan ulang: ubah baris PROVISION_REV di bawah lalu push.
# Aman dijalankan ulang (idempotent).
#
# PROVISION_REV: 8
#
# Secrets yang dibutuhkan (Settings -> Secrets and variables -> Actions,
# sebagai REPOSITORY secret):
#   SERVER_HOST     IP server, mis. 103.103.23.222
#   SERVER_USER     user SSH (butuh sudo tanpa password)
#   SERVER_SSH_KEY  private key SSH lengkap (termasuk baris BEGIN/END)
#   DB_PASSWORD     password user MySQL `toko_app` (tanpa tanda ' atau \)
#
# Hasil:
#   demo  -> http://<IP>/        root /var/www/demo/public   database toko_demo
#   dev   -> http://<IP>:8080/   root /var/www/dev/public    database toko_dev
#   dev   -> https://kangkungdev.duckdns.org/  (sama dengan dev, HTTPS Let's Encrypt)
#   toko  -> https://fastandflux.duckdns.org/  root /var/www/fastandflux/public  database toko_fastandflux
#            (branch toko-fastandflux)

on:
  push:
    branches: [claude-dev]
    paths:
      - .github/workflows/provision.yml
  workflow_dispatch:

concurrency:
  group: provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SECRETS: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_USER != '' && secrets.SERVER_SSH_KEY != '' && secrets.DB_PASSWORD != '' }}
    steps:
      - name: Lewati (secrets belum diisi)
        if: env.HAS_SECRETS != 'true'
        env:
          S_HOST: ${{ secrets.SERVER_HOST != '' }}
          S_USER: ${{ secrets.SERVER_USER != '' }}
          S_KEY: ${{ secrets.SERVER_SSH_KEY != '' }}
          S_DBPW: ${{ secrets.DB_PASSWORD != '' }}
        run: |
          missing=""
          [ "$S_HOST" = true ] || missing="$missing SERVER_HOST"
          [ "$S_USER" = true ] || missing="$missing SERVER_USER"
          [ "$S_KEY"  = true ] || missing="$missing SERVER_SSH_KEY"
          [ "$S_DBPW" = true ] || missing="$missing DB_PASSWORD"
          echo "::warning::Secret belum terbaca:$missing. Provision dilewati. Pastikan disimpan sebagai REPOSITORY secret dengan nama persis sama."

      - name: Setup server via SSH
        if: env.HAS_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DEV_DOMAIN: kangkungdev.duckdns.org
          # Toko lain di server yang sama: "nama-situs domain folder database" per baris.
          TOKO_LAIN: |
            toko-fastandflux fastandflux.duckdns.org /var/www/fastandflux toko_fastandflux
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Port 2222: jaringan Biznet memblokir port 22 dari GitHub (5 Okt 2026). Bisa diganti lewat secret SERVER_PORT.
          port: ${{ secrets.SERVER_PORT || '2222' }}
          command_timeout: 40m
          envs: DB_PASSWORD,DEV_DOMAIN,TOKO_LAIN
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            DEPLOY_USER="$(whoami)"

            echo "==> Cek sudo"
            if ! sudo -n true 2>/dev/null; then
              echo "User $DEPLOY_USER butuh sudo tanpa password (NOPASSWD)."
              exit 1
            fi

            case "$DB_PASSWORD" in
              *"'"*|*'\'*) echo "DB_PASSWORD tidak boleh mengandung ' atau \\"; exit 1 ;;
            esac

            . /etc/os-release
            echo "==> OS: $PRETTY_NAME"

            echo "==> Swap 2GB"
            if ! sudo swapon --show | grep -q '/swapfile'; then
              [ -f /swapfile ] || sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            echo 'vm.swappiness=10' | sudo tee /etc/sysctl.d/99-swappiness.conf >/dev/null
            sudo sysctl -p /etc/sysctl.d/99-swappiness.conf

            echo "==> Paket dasar"
            # Bersihkan PPA ondrej/php kalau sempat ditambahkan (tidak tersedia
            # untuk Ubuntu 26.04 "resolute" dan bikin apt-get update gagal).
            sudo rm -f /etc/apt/sources.list.d/ondrej-ubuntu-php-*.sources \
                       /etc/apt/sources.list.d/ondrej-ubuntu-php-*.list
            sudo apt-get update -y
            sudo apt-get install -y ca-certificates curl unzip git ufw

            # Pakai versi PHP bawaan Ubuntu (tanpa repo pihak ketiga).
            PHP_VER="$(apt-cache depends php-fpm | awk '/Depends: php[0-9]+\.[0-9]+-fpm/ {v=$2; sub(/^php/,"",v); sub(/-fpm$/,"",v); print v; exit}')"
            if [ -z "$PHP_VER" ]; then echo "Gagal mendeteksi versi PHP bawaan"; exit 1; fi
            echo "$PHP_VER" | sudo tee /etc/toko-php-version >/dev/null

            echo "==> Install Nginx, PHP ${PHP_VER}, MySQL"
            PKGS="nginx mysql-server php${PHP_VER}-fpm php${PHP_VER}-cli"
            for ext in mysql mbstring xml curl zip bcmath intl gd opcache; do
              if apt-cache show "php${PHP_VER}-${ext}" >/dev/null 2>&1; then
                PKGS="$PKGS php${PHP_VER}-${ext}"
              else
                echo "   (php${PHP_VER}-${ext} tidak ada sebagai paket terpisah, dilewati)"
              fi
            done
            sudo apt-get install -y $PKGS

            echo "==> Composer"
            if ! command -v composer >/dev/null; then
              EXPECTED="$(curl -fsSL https://composer.github.io/installer.sig)"
              php -r "copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');"
              ACTUAL="$(php -r "echo hash_file('sha384', '/tmp/composer-setup.php');")"
              if [ "$EXPECTED" != "$ACTUAL" ]; then echo "Checksum Composer tidak cocok"; exit 1; fi
              sudo php /tmp/composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer
              rm -f /tmp/composer-setup.php
            fi
            composer --version

            echo "==> Tuning PHP-FPM (pm=ondemand, hemat RAM)"
            POOL=/etc/php/${PHP_VER}/fpm/pool.d/www.conf
            sudo sed -i -E 's/^;?pm = .*/pm = ondemand/' "$POOL"
            sudo sed -i -E 's/^;?pm.max_children = .*/pm.max_children = 10/' "$POOL"
            sudo sed -i -E 's/^;?pm.process_idle_timeout = .*/pm.process_idle_timeout = 10s/' "$POOL"
            sudo sed -i -E 's/^;?pm.max_requests = .*/pm.max_requests = 500/' "$POOL"
            sudo tee /etc/php/${PHP_VER}/fpm/conf.d/99-toko.ini >/dev/null <<'EOF'
            memory_limit = 256M
            upload_max_filesize = 20M
            post_max_size = 25M
            max_execution_time = 60
            opcache.enable = 1
            opcache.memory_consumption = 96
            opcache.max_accelerated_files = 20000
            opcache.validate_timestamps = 1
            opcache.revalidate_freq = 2
            EOF

            echo "==> Tuning MySQL (RAM 2GB)"
            sudo tee /etc/mysql/mysql.conf.d/zz-toko-tuning.cnf >/dev/null <<'EOF'
            [mysqld]
            innodb_buffer_pool_size = 256M
            max_connections = 50
            performance_schema = OFF
            key_buffer_size = 8M
            tmp_table_size = 16M
            max_heap_table_size = 16M
            EOF
            sudo systemctl restart mysql

            echo "==> Database & user MySQL"
            sudo mysql <<SQL
            CREATE DATABASE IF NOT EXISTS toko_dev  CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS toko_demo CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE USER IF NOT EXISTS 'toko_app'@'localhost' IDENTIFIED BY '${DB_PASSWORD}';
            ALTER USER 'toko_app'@'localhost' IDENTIFIED BY '${DB_PASSWORD}';
            GRANT ALL PRIVILEGES ON toko_dev.*  TO 'toko_app'@'localhost';
            GRANT ALL PRIVILEGES ON toko_demo.* TO 'toko_app'@'localhost';
            FLUSH PRIVILEGES;
            SQL
            printf '%s\n' "$TOKO_LAIN" | while read -r _nama _domain _dir _db; do
              [ -n "${_db:-}" ] || continue
              sudo mysql -e "CREATE DATABASE IF NOT EXISTS \`${_db}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON \`${_db}\`.* TO 'toko_app'@'localhost'; FLUSH PRIVILEGES;"
              echo "   database ${_db}"
            done

            echo "==> Folder aplikasi"
            sudo usermod -aG www-data "$DEPLOY_USER"
            for d in /var/www/dev /var/www/demo $(printf '%s\n' "$TOKO_LAIN" | awk 'NF==4 {print $3}'); do
              sudo mkdir -p "$d"
              sudo chown "$DEPLOY_USER":www-data "$d"
              sudo chmod 2775 "$d"
            done

            echo "==> Nginx (demo :80, dev :8080, dev domain ${DEV_DOMAIN})"
            # Isi blok server yang sama untuk semua situs.
            site_body () {
              local root="$1"
              cat <<EOF
                root ${root}/public;
                index index.php index.html;
                charset utf-8;
                client_max_body_size 25M;

                add_header X-Frame-Options "SAMEORIGIN";
                add_header X-Content-Type-Options "nosniff";

                location / {
                    try_files \$uri \$uri/ /index.php?\$query_string;
                }

                location = /favicon.ico { access_log off; log_not_found off; }
                location = /robots.txt  { access_log off; log_not_found off; }

                error_page 404 /index.php;

                location ~ ^/index\.php(/|\$) {
                    fastcgi_pass unix:/run/php/php${PHP_VER}-fpm.sock;
                    fastcgi_param SCRIPT_FILENAME \$realpath_root\$fastcgi_script_name;
                    include fastcgi_params;
                    fastcgi_hide_header X-Powered-By;
                }

                location ~ /\.(?!well-known).* {
                    deny all;
                }
            EOF
            }
            write_site () {
              local name="$1" port="$2" root="$3" default="$4"
              {
                echo "server {"
                echo "    listen ${port}${default};"
                echo "    listen [::]:${port}${default};"
                echo "    server_name _;"
                site_body "$root"
                echo "}"
              } | sudo tee /etc/nginx/sites-available/"$name" >/dev/null
              sudo ln -sf /etc/nginx/sites-available/"$name" /etc/nginx/sites-enabled/"$name"
            }
            # Situs berbasis domain. Tanpa sertifikat: HTTP biasa.
            # Dengan sertifikat: HTTP -> redirect ke HTTPS.
            write_domain_site () {
              local name="$1" domain="$2" root="$3"
              local cert="/etc/letsencrypt/live/${domain}"
              {
                if sudo test -f "${cert}/fullchain.pem"; then
                  echo "server {"
                  echo "    listen 80;"
                  echo "    listen [::]:80;"
                  echo "    server_name ${domain};"
                  echo "    location /.well-known/acme-challenge/ { root ${root}/public; }"
                  echo "    location / { return 301 https://\$host\$request_uri; }"
                  echo "}"
                  echo "server {"
                  echo "    listen 443 ssl;"
                  echo "    listen [::]:443 ssl;"
                  echo "    http2 on;"
                  echo "    server_name ${domain};"
                  echo "    ssl_certificate ${cert}/fullchain.pem;"
                  echo "    ssl_certificate_key ${cert}/privkey.pem;"
                  echo "    ssl_protocols TLSv1.2 TLSv1.3;"
                  echo "    ssl_session_cache shared:SSL:10m;"
                  echo "    ssl_session_timeout 1d;"
                  echo "    add_header Strict-Transport-Security \"max-age=31536000\" always;"
                else
                  echo "server {"
                  echo "    listen 80;"
                  echo "    listen [::]:80;"
                  echo "    server_name ${domain};"
                fi
                site_body "$root"
                echo "}"
              } | sudo tee /etc/nginx/sites-available/"$name" >/dev/null
              sudo ln -sf /etc/nginx/sites-available/"$name" /etc/nginx/sites-enabled/"$name"
            }
            sudo rm -f /etc/nginx/sites-enabled/default
            write_site toko-demo 80   /var/www/demo " default_server"
            write_site toko-dev  8080 /var/www/dev  ""
            write_domain_site toko-dev-domain "$DEV_DOMAIN" /var/www/dev
            printf '%s\n' "$TOKO_LAIN" | while read -r _nama _domain _dir _db; do
              [ -n "${_db:-}" ] || continue
              write_domain_site "$_nama" "$_domain" "$_dir"
            done
            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx

            echo "==> HTTPS Let's Encrypt"
            sudo apt-get install -y certbot
            sudo mkdir -p /etc/letsencrypt/renewal-hooks/deploy
            printf '#!/bin/sh\nsystemctl reload nginx\n' | sudo tee /etc/letsencrypt/renewal-hooks/deploy/reload-nginx >/dev/null
            sudo chmod +x /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
            # Webroot: file tantangan ditaruh di public/.well-known (dilayani Nginx port 80).
            pasang_https () {
              local name="$1" domain="$2" root="$3"
              if sudo test -f "/etc/letsencrypt/live/${domain}/fullchain.pem"; then
                echo "   ${domain}: sertifikat sudah ada (diperpanjang otomatis oleh certbot.timer)"
                return 0
              fi
              sudo mkdir -p "${root}/public/.well-known/acme-challenge"
              sudo chown -R "$DEPLOY_USER":www-data "${root}/public"
              if sudo certbot certonly --webroot -w "${root}/public" -d "$domain" \
                   --non-interactive --agree-tos --register-unsafely-without-email; then
                write_domain_site "$name" "$domain" "$root"
                sudo nginx -t
                echo "   ${domain}: sertifikat dibuat"
              else
                echo "::warning::Sertifikat HTTPS untuk ${domain} gagal dibuat (cek DNS DuckDNS mengarah ke server). Situs tetap jalan via HTTP."
              fi
            }
            pasang_https toko-dev-domain "$DEV_DOMAIN" /var/www/dev
            printf '%s\n' "$TOKO_LAIN" | while read -r _nama _domain _dir _db; do
              [ -n "${_db:-}" ] || continue
              pasang_https "$_nama" "$_domain" "$_dir"
            done
            sudo systemctl enable --now certbot.timer 2>/dev/null || true

            echo "==> SSH juga di port 2222 (port 22 dari GitHub diblokir jaringan Biznet), login password dimatikan"
            printf 'Port 22\nPort 2222\nPasswordAuthentication no\n' | sudo tee /etc/ssh/sshd_config.d/10-toko.conf >/dev/null

            echo "==> Firewall (ufw)"
            sudo ufw allow OpenSSH
            sudo ufw allow 22/tcp
            sudo ufw allow 2222/tcp
            sudo ufw allow 80/tcp
            sudo ufw allow 443/tcp
            sudo ufw allow 8080/tcp
            sudo ufw --force enable
            sudo ufw status verbose

            echo "==> Restart service"
            sudo systemctl enable --now nginx php${PHP_VER}-fpm mysql
            sudo systemctl restart php${PHP_VER}-fpm
            sudo systemctl reload nginx

            sudo touch /var/www/.provisioned
            echo "==> Selesai. Ringkasan:"
            php -v | head -1
            mysql --version
            nginx -v 2>&1
            free -h
