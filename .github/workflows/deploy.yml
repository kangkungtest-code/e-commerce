name: Deploy

# Tiap push:
#   1. job `test`  — composer install, migrate:fresh --seed ke MySQL, php artisan test.
#                    Kalau composer.lock belum ada, dibuat di sini lalu di-commit balik
#                    ke branch yang sama.
#   2. job `deploy` — hanya kalau test lulus:
#        claude-dev -> /var/www/dev   (http://<IP>:8080, database toko_dev,  APP_ENV=dev)
#        main       -> /var/www/demo  (http://<IP>/,     database toko_demo, APP_ENV=demo)
#
# Secrets (repository secrets):
#   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY, DB_PASSWORD  — wajib untuk deploy
#   ADMIN_EMAIL (opsional, default admin@toko.test), ADMIN_PASSWORD — akun admin awal
# Kalau secrets server belum diisi atau server belum di-provision, deploy dilewati
# dengan peringatan (tidak gagal merah).

on:
  push:
    branches: [claude-dev, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: toko_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: toko_ci
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5

      - name: Cek ada aplikasi Laravel
        id: app
        run: |
          if [ -f artisan ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: shivammathur/setup-php@v2
        if: steps.app.outputs.exists == 'true'
        with:
          php-version: "8.5"
          extensions: mbstring, intl, pdo_mysql, bcmath, zip, gd
          coverage: none

      - name: Composer
        id: composer
        if: steps.app.outputs.exists == 'true'
        run: |
          set -o pipefail
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee -a /tmp/ci.log
            echo "lock_baru=false" >> "$GITHUB_OUTPUT"
          else
            composer update --no-interaction --prefer-dist --no-progress 2>&1 | tee -a /tmp/ci.log
            echo "lock_baru=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrate & seed ke MySQL
        if: steps.app.outputs.exists == 'true'
        env:
          ADMIN_EMAIL: ci-admin@toko.test
          ADMIN_PASSWORD: ci-password
        run: |
          set -o pipefail
          cp .env.example .env
          php artisan key:generate 2>&1 | tee -a /tmp/ci.log
          php artisan migrate:fresh --seed --force 2>&1 | tee -a /tmp/ci.log
          php artisan migrate:rollback --force 2>&1 | tee -a /tmp/ci.log
          php artisan migrate --force 2>&1 | tee -a /tmp/ci.log

      - name: Test
        if: steps.app.outputs.exists == 'true'
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee -a /tmp/ci.log

      - name: Commit composer.lock
        if: steps.composer.outputs.lock_baru == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Tambah composer.lock (dibuat otomatis oleh CI)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Ringkas error
        if: failure()
        run: |
          [ -f /tmp/ci.log ] || exit 0
          msg=$(tail -n 60 /tmp/ci.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Test gagal (60 baris terakhir)::${msg}"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SECRETS: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_USER != '' && secrets.SERVER_SSH_KEY != '' && secrets.DB_PASSWORD != '' }}
    steps:
      - name: Tentukan target
        id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "dir=/var/www/demo"  >> "$GITHUB_OUTPUT"
            echo "db=toko_demo"       >> "$GITHUB_OUTPUT"
            echo "env=demo"           >> "$GITHUB_OUTPUT"
            echo "debug=false"        >> "$GITHUB_OUTPUT"
            echo "url=http://${{ secrets.SERVER_HOST }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=/var/www/dev"   >> "$GITHUB_OUTPUT"
            echo "db=toko_dev"        >> "$GITHUB_OUTPUT"
            echo "env=dev"            >> "$GITHUB_OUTPUT"
            echo "debug=true"         >> "$GITHUB_OUTPUT"
            # Domain dev (DuckDNS) + HTTPS dipasang oleh provision.yml.
            echo "url=https://kangkungdev.duckdns.org" >> "$GITHUB_OUTPUT"
          fi

      - name: Lewati (secrets belum diisi)
        if: env.HAS_SECRETS != 'true'
        run: echo "::warning::Secrets SERVER_HOST/SERVER_USER/SERVER_SSH_KEY/DB_PASSWORD belum lengkap, deploy dilewati."

      - name: Deploy via SSH
        if: env.HAS_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          TOKO_BRANCH: ${{ github.ref_name }}
          TOKO_REPO: ${{ github.repository }}
          TOKO_GH_TOKEN: ${{ github.token }}
          TOKO_TARGET: ${{ steps.target.outputs.dir }}
          TOKO_DB_NAME: ${{ steps.target.outputs.db }}
          TOKO_APP_ENV_VAL: ${{ steps.target.outputs.env }}
          TOKO_APP_DEBUG_VAL: ${{ steps.target.outputs.debug }}
          TOKO_APP_URL_VAL: ${{ steps.target.outputs.url }}
          TOKO_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TOKO_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          TOKO_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TOKO_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          TOKO_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TOKO_LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          TOKO_LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          TOKO_MAIL_HOST: ${{ secrets.MAIL_HOST }}
          TOKO_MAIL_PORT: ${{ secrets.MAIL_PORT }}
          TOKO_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          TOKO_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          TOKO_MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          TOKO_ALAMAT_RETUR: ${{ secrets.TOKO_ALAMAT_RETUR }}
          TOKO_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          TOKO_PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          TOKO_PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          TOKO_XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          TOKO_XENDIT_CALLBACK_TOKEN: ${{ secrets.XENDIT_CALLBACK_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 25m
          envs: TOKO_BRANCH,TOKO_REPO,TOKO_GH_TOKEN,TOKO_TARGET,TOKO_DB_NAME,TOKO_APP_ENV_VAL,TOKO_APP_DEBUG_VAL,TOKO_APP_URL_VAL,TOKO_DB_PASSWORD,TOKO_ADMIN_EMAIL,TOKO_ADMIN_PASSWORD,TOKO_GOOGLE_CLIENT_ID,TOKO_GOOGLE_CLIENT_SECRET,TOKO_LINE_CHANNEL_ID,TOKO_LINE_CHANNEL_SECRET,TOKO_MAIL_HOST,TOKO_MAIL_PORT,TOKO_MAIL_USERNAME,TOKO_MAIL_PASSWORD,TOKO_MAIL_FROM_ADDRESS,TOKO_ALAMAT_RETUR,TOKO_PAYPAL_CLIENT_ID,TOKO_PAYPAL_CLIENT_SECRET,TOKO_PAYPAL_WEBHOOK_ID,TOKO_XENDIT_SECRET_KEY,TOKO_XENDIT_CALLBACK_TOKEN
          script: |
            if [ ! -f /var/www/.provisioned ]; then
              echo "::warning::Server belum di-provision. Deploy dilewati."
              exit 0
            fi

            LOG="/tmp/deploy-${TOKO_BRANCH}.log"
            : > "$LOG"

            deploy () {
              set -euo pipefail

              echo "==> Deploy $TOKO_BRANCH -> $TOKO_TARGET"
              AUTH_URL="https://x-access-token:${TOKO_GH_TOKEN}@github.com/${TOKO_REPO}.git"
              PLAIN_URL="https://github.com/${TOKO_REPO}.git"

              cd "$TOKO_TARGET"
              if [ ! -d .git ]; then
                git init -q
                git remote add origin "$PLAIN_URL"
              fi
              git fetch -q --depth 1 "$AUTH_URL" "$TOKO_BRANCH"
              git checkout -q -B "$TOKO_BRANCH" FETCH_HEAD
              git reset -q --hard FETCH_HEAD
              git log -1 --oneline

              if [ ! -f artisan ]; then
                echo "Belum ada aplikasi Laravel, langkah Laravel dilewati."
                return 0
              fi

              echo "==> Permission storage & cache"
              mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
              sudo -n chown -R "$(whoami)":www-data storage bootstrap/cache
              sudo -n chmod -R ug+rwX storage bootstrap/cache

              echo "==> .env"
              if [ ! -f .env ]; then
                cp .env.example .env
              fi
              set_env () {
                local key="$1" val="$2" esc
                esc=$(printf '%s' "$val" | sed -e 's/[\/&|]/\\&/g')
                if grep -qE "^#?\s*${key}=" .env; then
                  sed -i -E "s|^#?\s*${key}=.*|${key}=${esc}|" .env
                else
                  printf '%s=%s\n' "$key" "$val" >> .env
                fi
              }
              set_env APP_ENV "$TOKO_APP_ENV_VAL"
              set_env APP_DEBUG "$TOKO_APP_DEBUG_VAL"
              set_env APP_URL "$TOKO_APP_URL_VAL"
              set_env DB_CONNECTION mysql
              set_env DB_HOST 127.0.0.1
              set_env DB_PORT 3306
              set_env DB_DATABASE "$TOKO_DB_NAME"
              set_env DB_USERNAME toko_app
              set_env DB_PASSWORD "$TOKO_DB_PASSWORD"
              # Kredensial admin tidak disimpan di .env server, hanya dipakai seeder.
              set_env ADMIN_EMAIL ""
              set_env ADMIN_PASSWORD ""
              # Login sosial (opsional): tombol Google/LINE muncul kalau secret-nya diisi.
              set_env GOOGLE_CLIENT_ID "${TOKO_GOOGLE_CLIENT_ID:-}"
              set_env GOOGLE_CLIENT_SECRET "${TOKO_GOOGLE_CLIENT_SECRET:-}"
              set_env LINE_CHANNEL_ID "${TOKO_LINE_CHANNEL_ID:-}"
              set_env LINE_CHANNEL_SECRET "${TOKO_LINE_CHANNEL_SECRET:-}"
              set_env APP_NAME '"Kangkung Apparel"'
              set_env QUEUE_CONNECTION database
              # Email: SMTP kalau secret MAIL_HOST diisi; kalau belum, email hanya dicatat di log.
              if [ -n "${TOKO_MAIL_HOST:-}" ]; then
                set_env MAIL_MAILER smtp
                set_env MAIL_HOST "$TOKO_MAIL_HOST"
                set_env MAIL_PORT "${TOKO_MAIL_PORT:-587}"
                set_env MAIL_USERNAME "${TOKO_MAIL_USERNAME:-}"
                set_env MAIL_PASSWORD "${TOKO_MAIL_PASSWORD:-}"
                set_env MAIL_SCHEME "$([ "${TOKO_MAIL_PORT:-587}" = "465" ] && echo smtps || echo smtp)"
                set_env MAIL_FROM_ADDRESS "${TOKO_MAIL_FROM_ADDRESS:-${TOKO_MAIL_USERNAME:-}}"
              else
                set_env MAIL_MAILER log
              fi
              set_env TOKO_ALAMAT_RETUR "\"${TOKO_ALAMAT_RETUR:-}\""
              # Pembayaran: dev/demo selalu sandbox / kunci test.
              set_env PAYPAL_MODE sandbox
              set_env PAYPAL_CLIENT_ID "${TOKO_PAYPAL_CLIENT_ID:-}"
              set_env PAYPAL_CLIENT_SECRET "${TOKO_PAYPAL_CLIENT_SECRET:-}"
              set_env PAYPAL_WEBHOOK_ID "${TOKO_PAYPAL_WEBHOOK_ID:-}"
              set_env XENDIT_SECRET_KEY "${TOKO_XENDIT_SECRET_KEY:-}"
              set_env XENDIT_CALLBACK_TOKEN "${TOKO_XENDIT_CALLBACK_TOKEN:-}"
              sudo -n chown "$(whoami)":www-data .env
              chmod 640 .env

              echo "==> Composer install"
              rm -f bootstrap/cache/config.php bootstrap/cache/routes-*.php
              if [ "$TOKO_APP_ENV_VAL" = "demo" ]; then
                composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
              else
                composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
              fi

              if ! grep -qE '^APP_KEY=.+' .env; then
                php artisan key:generate --force
              fi

              echo "==> Migrate & seed"
              php artisan config:clear
              php artisan migrate --force
              ADMIN_EMAIL="${TOKO_ADMIN_EMAIL:-admin@toko.test}" ADMIN_PASSWORD="${TOKO_ADMIN_PASSWORD:-}" \
                php artisan db:seed --force

              echo "==> Cache"
              php artisan storage:link 2>/dev/null || true
              php artisan optimize
              php artisan filament:optimize 2>/dev/null || true

              sudo -n chown -R "$(whoami)":www-data storage bootstrap/cache
              sudo -n chmod -R ug+rwX storage bootstrap/cache
              sudo -n systemctl reload "php$(cat /etc/toko-php-version)-fpm" || true
              echo "==> Cron scheduler (order kadaluarsa, dll.)"
              CRON_LINE="* * * * * cd ${TOKO_TARGET} && php artisan schedule:run >> /dev/null 2>&1"
              CRON_ADA="$(crontab -l 2>/dev/null || true)"
              CRON_LAIN="$(printf '%s\n' "$CRON_ADA" | grep -vF "cd ${TOKO_TARGET} && php artisan schedule:run" || true)"
              printf '%s\n%s\n' "$CRON_LAIN" "$CRON_LINE" | sed '/^$/d' | crontab -
              crontab -l | grep -F "${TOKO_TARGET}"

              echo "==> Cek situs dari server"
              HOSTNYA="$(echo "$TOKO_APP_URL_VAL" | sed -E 's#^https?://([^/:]+).*#\1#')"
              CEK="$(curl -sS -o /dev/null --max-time 20 --resolve "${HOSTNYA}:443:127.0.0.1" \
                     -w '%{http_code} %{redirect_url}' "$TOKO_APP_URL_VAL/" 2>&1 || true)"
              echo "::notice title=Cek ${TOKO_APP_URL_VAL}::${CEK}"

              echo "==> Deploy selesai: $TOKO_APP_URL_VAL"
            }

            set -o pipefail
            ( deploy ) 2>&1 | tee "$LOG"
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              msg=$(tail -n 40 "$LOG" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=Deploy gagal (40 baris terakhir)::${msg}"
              exit "$status"
            fi
