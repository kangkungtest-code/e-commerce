name: Super Admin

# Sekali jalan: jadikan akun Super Admin (pengatur fitur & paket) di kangkungdev.
# Email: secret SUPERADMIN_EMAIL, kalau kosong pakai ADMIN_EMAIL (akun admin yang sudah ada).
# Password: secret SUPERADMIN_PASSWORD (hanya dipakai kalau akunnya belum ada / mau diganti).
# Jalan otomatis kalau file ini berubah di claude-dev. Ubah SUPER_REV untuk mengulang.
# SUPER_REV: 1

on:
  push:
    branches: [claude-dev]
    paths:
      - .github/workflows/super-admin.yml
  workflow_dispatch:

jobs:
  super-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Buat / perbarui Super Admin lewat SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TOKO_SA_EMAIL: ${{ secrets.SUPERADMIN_EMAIL || secrets.ADMIN_EMAIL || 'admin@toko.test' }}
          TOKO_SA_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          timeout: 60s
          command_timeout: 15m
          envs: TOKO_SA_EMAIL,TOKO_SA_PASSWORD
          script: |
            cd /var/www/dev
            # Tunggu deploy tarik memasang kode yang punya perintah ini (maks ±12 menit).
            for i in $(seq 1 48); do
              php artisan list --raw 2>/dev/null | grep -q '^toko:super-admin' && break
              sleep 15
            done
            if SUPERADMIN_PASSWORD="$TOKO_SA_PASSWORD" php artisan toko:super-admin "$TOKO_SA_EMAIL" > /tmp/super-admin.log 2>&1; then
              echo "::notice title=Super Admin::$(tail -n 1 /tmp/super-admin.log)"
            else
              echo "::error title=Super Admin gagal::$(tail -n 3 /tmp/super-admin.log | tr '\n' ' ')"
              exit 1
            fi
